name: Production deploy

on:
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: rsync deployments
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avzr --exclude=".git" --exclude=".github" --exclude=".env.example" --exclude=".editorconfig" --exclude="ecosystem.config.js" --exclude=".gitignore" --exclude="node_modules" --exclude=".env" --exclude=".env.*"
          path: ./
          remote_path: /var/www/html/saathi-web-application-production
          remote_host: ${{ secrets.DEV_SSH_HOST}}
          remote_user: ${{ secrets.DEV_SSH_USERNAME }}
          remote_key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.DEV_SSH_PORT }}

      - name: run_docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SSH_HOST}}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            cd /var/www/html/saathi-web-application-production
            npm ci
            # Build BEFORE touching pm2. The old order deleted the process
            # first, so a failed build left the site deleted and down.
            NODE_OPTIONS="--max-old-space-size=4096" npm run build
            # Restart by name; start from the env-specific config only if it is
            # not running. `pm2 start ecosystem.config.js` here used to start
            # production under staging's name.
            pm2 restart saathi-app-production --update-env || pm2 start ecosystem.production.config.js
            pm2 save
